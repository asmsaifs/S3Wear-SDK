[package]
name = "{{crate}}"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
s3w = { path = "{{sdk_rust}}/s3w" }

# Small and panic-free: `s3w build` adds the wasm flags (no reference types, memory from the manifest).
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"
