# SDK CI: builds every example and every template, runs the CLI tests. Exported from the private
# repo (tools/sdk/public/), not edited here. The `container` job builds and smoke-tests the dev container (docker/).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          rustup target add wasm32-unknown-unknown

      - name: CLI tests
        run: python3 -m unittest discover -s cli/tests

      # Every function in include/s3w.h is documented with @since, and docs/api is what the generator writes.
      - name: API reference is fresh
        run: |
          python3 -m unittest discover -s scripts -p "test_gen*"
          python3 scripts/gen_api_docs.py --check

      # Links, and every marked code block of the docs builds (C and Rust). Manifests and faces are also checked
      # against the simulator in the container job below.
      - name: Developer docs
        run: |
          python3 -m unittest discover -s scripts -p "test_check_docs*"
          python3 scripts/check_docs.py

      - name: Examples
        run: examples/build.sh

      - name: Sample apps
        run: |
          for d in examples/apps/*/; do
            [ -f "$d/manifest.json" ] || continue
            cli/s3w build "$d"
          done

      - name: Templates (C and Rust)
        run: |
          cli/s3w new "$RUNNER_TEMP/tpl-c" --lang c
          cli/s3w build "$RUNNER_TEMP/tpl-c"
          cli/s3w new "$RUNNER_TEMP/tpl-rust" --lang rust
          cli/s3w build "$RUNNER_TEMP/tpl-rust"

      - name: Wheel (what `pipx install s3w` gets)
        run: |
          cli/vendor_sdk.sh
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install ./cli
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/v/bin/s3w" new wheel-app && "$RUNNER_TEMP/v/bin/s3w" build wheel-app

      - name: Crates
        run: |
          cargo build --manifest-path rust/s3w/Cargo.toml --target wasm32-unknown-unknown

  # The dev container: the image builds and, inside it, every sample app and template builds and (with the simulator)
  # starts. The simulator is installed from the firmware site, so set the repository variable
  # S3W_SIM_PUBLISHED=true once a release has published one; until then the image is built without it.
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: |
          with_sim=0; [ "${{ vars.S3W_SIM_PUBLISHED }}" = true ] && with_sim=1
          docker build -f docker/Dockerfile --build-arg WITH_SIM=$with_sim -t s3w-sdk:ci .

      - name: Smoke test inside the image
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          docker run --rm -e REQUIRE_SIM="${{ vars.S3W_SIM_PUBLISHED == 'true' && '1' || '0' }}" \
            -v "$PWD:/work:ro" -v "$RUNNER_TEMP/shots:/shots" s3w-sdk:ci /work/docker/smoke.sh /shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-screenshots
          path: ${{ runner.temp }}/shots/
          if-no-files-found: ignore
